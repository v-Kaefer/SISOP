# Configuração do Simulador de Sistema Operacional
# Edite os valores abaixo para ajustar o comportamento do sistema

[MEMORIA]
# Tamanho da memória física em palavras (deve ser múltiplo de tam_pg)
mem_size = 64

# Tamanho de cada página em palavras
tam_pg = 16

[CPU]
# Quantum de tempo (número de instruções por fatia)
quantum = 5

# Modo debug (True/False) - exibe cada instrução executada
debug = False

[IO]
# Latência simulada de operações de I/O em segundos
io_latency = 2.0

# Latência simulada de operações de disco em segundos
disk_latency = 0.3

[LOGGING]
# Nome do arquivo de log
log_file = system_log.txt

# Diretório para dumps de memória
dump_dir = memory_dumps

[ESCALONAMENTO]
# Política de escalonamento (atualmente apenas FIFO)
policy = FIFO

[PAGINACAO]
# Política de substituição de páginas (FIFO ou LRU)
replacement_policy = FIFO
